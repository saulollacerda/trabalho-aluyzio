name: Verificar backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rh_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: rh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rh_test -d rh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Testar banco embarcado e domínio
        run: npm test
      - name: Testar PostgreSQL real
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://rh_test:test_only@127.0.0.1:5432/rh_test
      - name: Validar contrato OpenAPI
        run: npm run openapi
      - name: Conferir contrato versionado
        run: git diff --exit-code -- docs/openapi.json
